name: Build SilvestreOS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
          - recipes/recipe-nvidia.yml

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run BlueBuild CLI Manually
        run: |
          if [ -f "${{ matrix.recipe }}" ]; then
            podman run --rm \
              --security-opt label=disable \
              -v $(pwd):/workdir \
              -w /workdir \
              ghcr.io/blue-build/cli:latest \
              bluebuild build --no-sign "${{ matrix.recipe }}"
          else
            echo "La receta ${{ matrix.recipe }} no existe en este directorio, saltando..."
          fi
