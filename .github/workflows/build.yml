name: Build Custom Image
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: uger/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false

      - name: Build Image with Podman
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run BlueBuild CLI without signature
        run: |
          podman run --rm \
            --security-opt label=disable \
            -v $(pwd):/workdir \
            -w /workdir \
            ghcr.io/blue-build/cli:latest \
            build --no-sign recipe.yml
