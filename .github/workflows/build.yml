name: Build SilvestreOS
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipes/recipe.yml
          # Si tienes otra receta, añádela aquí abajo con su ruta exacta:
          # - recipes/otra-receta.yml

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Custom Image
        uses: blue-build/github-action@v1.14
        with:
          recipe: ${{ matrix.recipe }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          cli_args: "--no-sign"
