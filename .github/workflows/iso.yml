name: Build ISO
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build Custom ISO
        uses: blue-build/github-action@v1
        with:
          recipe: recipes/recipe.yml
          cli-version: latest
          args: --no-sign
