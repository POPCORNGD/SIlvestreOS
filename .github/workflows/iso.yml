name: Build ISOs
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'recipe.yml'
      - 'recipes/**'

jobs:
  build-standard-iso:
    name: Build Standard ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build Standard ISO from Image
        uses: blue-build/iso-action@v1
        with:
          recipe: recipe.yml
          image-name: silvestre
          output-name: SilvestreOS-Standard-Installer

  build-nvidia-iso:
    name: Build Nvidia ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build Nvidia ISO from Image
        uses: blue-build/iso-action@v1
        with:
          recipe: recipes/recipe-nvidia.yml
          image-name: silvestre-nvidia
          output-name: SilvestreOS-Nvidia-Installer
